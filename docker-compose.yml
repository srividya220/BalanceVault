services:
  postgres:
    image: postgres:17-alpine
    container_name: balancevault-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: vault_db_password_2026
      POSTGRES_DB: balancevault
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d balancevault"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: balancevault-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: balancevault-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 8080
      NODE_ENV: production
      DATABASE_URL: "postgresql://postgres:vault_db_password_2026@postgres:5432/balancevault?schema=public"
      JWT_SECRET: "production-grade-super-secret-balancevault-key-2026"
      JWT_EXPIRES_IN: "24h"
      REDIS_URL: "redis://redis:6379"
      ADMIN_EMAIL: "admin@balancevault.com"
      ADMIN_PASSWORD: "AdminVaultPassword2026!"
      ADMIN_FULL_NAME: "System Administrator"
      SYSTEM_RESERVE_ACCOUNT_NUMBER: "BV-SYS-RESERVE-001"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: balancevault-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
  redisdata:
